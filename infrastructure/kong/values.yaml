# Install with: helm repo add kong https://charts.konghq.com
# helm upgrade --install kong kong/ingress --namespace kong --create-namespace -f values.yaml
controller:
  ingressController:
    enabled: true

gateway:
  proxy:
    enabled: true
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      service.beta.kubernetes.io/azure-load-balancer-ipv4: "10.20.1.10"
    http:
      enabled: true
      servicePort: 80
    tls:
      enabled: false
