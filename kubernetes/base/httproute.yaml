apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blue-green-route
  namespace: blue-green
spec:
  parentRefs:
    - name: kong
      namespace: kong
  hostnames:
    - "bluegreen.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: green
          port: 80
          weight: 100
        - name: blue
          port: 80
          weight: 0
