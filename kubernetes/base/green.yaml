apiVersion: v1
kind: ConfigMap
metadata:
  name: green-web
  namespace: blue-green
data:
  index.html: |
    <!doctype html>
    <html><head><title>Green</title></head>
    <body style="font-family:Arial;text-align:center;margin-top:10%">
      <h1 style="color:green">GREEN environment</h1>
      <p>Version 1 - currently stable</p>
    </body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: green
  namespace: blue-green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
      release: green
  template:
    metadata:
      labels:
        app: demo
        release: green
    spec:
      nodeSelector:
        workload: green
      tolerations:
        - key: workload
          operator: Equal
          value: green
          effect: NoSchedule
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: web-content
          configMap:
            name: green-web
---
apiVersion: v1
kind: Service
metadata:
  name: green
  namespace: blue-green
spec:
  type: ClusterIP
  selector:
    app: demo
    release: green
  ports:
    - name: http
      port: 80
      targetPort: http
